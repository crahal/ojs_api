# Install as /etc/systemd/journald.conf.d/60-ojs-api.conf (root:root, mode 0644).
# These limits apply to the whole host's default journal, including other services.
# Old logs are pruned; this does not prune the pipeline's checksummed audit reports.
[Journal]
Storage=persistent
SystemMaxUse=128M
SystemKeepFree=1G
RuntimeMaxUse=32M
MaxRetentionSec=14day
MaxFileSec=1day
